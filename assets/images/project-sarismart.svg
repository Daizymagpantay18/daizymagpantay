<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="sariBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14120f"/>
      <stop offset="50%" stop-color="#0e0d0c"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="neonOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F28C28"/>
      <stop offset="100%" stop-color="#FFB347"/>
    </linearGradient>
    <filter id="aiGlow">
      <feDropShadow dx="0" dy="15" stdDeviation="25" flood-color="#F28C28" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#sariBg)"/>
  
  <text x="600" y="440" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="130" font-weight="900" letter-spacing="14" fill="rgba(255,255,255,0.02)">SARISMART</text>

  <!-- Visual AI Recognition UI -->
  <g filter="url(#aiGlow)">
    <rect x="250" y="150" width="700" height="450" rx="16" fill="#111111" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    
    <!-- Top Header -->
    <rect x="250" y="150" width="700" height="50" rx="16" fill="#171717"/>
    <text x="280" y="181" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#F5F5F5">SARISMART AI // VISION TERMINAL</text>
    <circle cx="890" cy="175" r="5" fill="#F28C28"/>
    <text x="910" y="179" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#FFB347">AI MODEL ONLINE</text>

    <!-- Camera Viewport Box -->
    <rect x="280" y="220" width="380" height="350" rx="10" fill="#0c0c0c" stroke="rgba(242,140,40,0.4)" stroke-width="1.5"/>
    
    <!-- Target Bounding Box -->
    <rect x="340" y="270" width="220" height="200" rx="4" fill="none" stroke="url(#neonOrange)" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="350" y="260" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#FFB347">MATCH: Canned Goods (99.4%)</text>

    <line x1="330" y1="270" x2="350" y2="270" stroke="#FFB347" stroke-width="3"/>
    <line x1="330" y1="270" x2="330" y2="290" stroke="#FFB347" stroke-width="3"/>
    <line x1="570" y1="470" x2="550" y2="470" stroke="#FFB347" stroke-width="3"/>
    <line x1="570" y1="470" x2="570" y2="450" stroke="#FFB347" stroke-width="3"/>

    <!-- Right Side Cart & Inventory -->
    <rect x="680" y="220" width="240" height="350" rx="10" fill="#151515" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="700" y="250" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#A0A0A0">DETECTED ITEMS</text>
    
    <!-- Item 1 -->
    <rect x="700" y="270" width="200" height="50" rx="6" fill="#1c1c1c"/>
    <text x="715" y="292" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#F5F5F5">Corned Beef 150g</text>
    <text x="715" y="310" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#F28C28">₱42.00 • Qty: 2</text>

    <!-- Item 2 -->
    <rect x="700" y="330" width="200" height="50" rx="6" fill="#1c1c1c"/>
    <text x="715" y="352" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#F5F5F5">Instant Noodles 55g</text>
    <text x="715" y="370" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#F28C28">₱18.00 • Qty: 3</text>

    <rect x="700" y="500" width="200" height="45" rx="6" fill="url(#neonOrange)"/>
    <text x="800" y="528" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#080808">CHECKOUT ₱138.00</text>
  </g>
</svg>
