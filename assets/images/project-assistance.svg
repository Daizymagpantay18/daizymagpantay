<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="astBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121417"/>
      <stop offset="50%" stop-color="#0e1013"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="astOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F28C28"/>
      <stop offset="100%" stop-color="#FFB347"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#astBg)"/>
  
  <text x="600" y="440" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="110" font-weight="900" letter-spacing="12" fill="rgba(255,255,255,0.02)">ASSISTANCE</text>

  <!-- Scheduling Matrix Console -->
  <g>
    <rect x="240" y="140" width="720" height="470" rx="16" fill="#111111" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    
    <rect x="240" y="140" width="720" height="50" rx="16" fill="#171717"/>
    <text x="270" y="171" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#F5F5F5">STUDENT ASSISTANT SCHEDULING MATRIX</text>
    <rect x="830" y="152" width="100" height="26" rx="4" fill="url(#astOrange)" opacity="0.15"/>
    <text x="880" y="169" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" fill="#FFB347">SEMESTER 1</text>

    <!-- Time Table Grid Mockup -->
    <g transform="translate(270, 220)">
      <!-- Header Row -->
      <rect x="0" y="0" width="660" height="35" rx="6" fill="#1c1c1c"/>
      <text x="40" y="22" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#A0A0A0">TIME</text>
      <text x="160" y="22" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#A0A0A0">MON</text>
      <text x="280" y="22" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#A0A0A0">TUE</text>
      <text x="400" y="22" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#A0A0A0">WED</text>
      <text x="520" y="22" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#A0A0A0">THU</text>

      <!-- Slot 1 -->
      <text x="40" y="70" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#777">08:00 AM</text>
      <rect x="130" y="50" width="100" height="50" rx="6" fill="#F28C28" opacity="0.2" stroke="#F28C28" stroke-width="1"/>
      <text x="140" y="75" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" fill="#FFB347">Lab Duty (D.M.)</text>

      <rect x="250" y="50" width="100" height="50" rx="6" fill="#222"/>
      <text x="260" y="75" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#888">Class Enrolled</text>

      <!-- Slot 2 -->
      <text x="40" y="140" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#777">10:30 AM</text>
      <rect x="370" y="120" width="100" height="50" rx="6" fill="#F28C28" opacity="0.2" stroke="#F28C28" stroke-width="1"/>
      <text x="380" y="145" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" fill="#FFB347">Library Desk</text>

      <!-- Slot 3 -->
      <text x="40" y="210" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#777">01:00 PM</text>
      <rect x="490" y="190" width="100" height="50" rx="6" fill="#F28C28" opacity="0.2" stroke="#F28C28" stroke-width="1"/>
      <text x="500" y="215" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" fill="#FFB347">Registrar Asst</text>
    </g>

    <!-- Bottom summary row -->
    <rect x="270" y="540" width="660" height="45" rx="8" fill="#161616" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="290" y="568" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#A0A0A0">TOTAL ASSISTANTS: <tspan fill="#F5F5F5" font-weight="700">38 ACTIVE</tspan></text>
    <text x="600" y="568" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#A0A0A0">ACCUMULATED HOURS: <tspan fill="#F28C28" font-weight="700">920 HRS</tspan></text>
  </g>
</svg>
